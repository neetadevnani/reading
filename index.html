const P=[{"t": "The Bridge That Learned to Sway", "k": "prose", "tip": "main", "p": ["When engineers first designed tall bridges, they believed stronger meant stiffer. A bridge, they reasoned, should stand like a wall against the wind. For decades, builders added heavier steel and thicker beams, trusting that sheer weight would keep their structures still. Steel was expensive, but safety seemed worth any price. Engineers pointed proudly to massive railroad bridges that barely trembled when heavy trains thundered across them. If those bridges could hold firm, the thinking went, so could any bridge, as long as it was built solidly enough.", "In 1940, that belief was tested. The Tacoma Narrows Bridge in Washington State had been open only four months when a steady wind of about forty miles per hour set its deck twisting. Drivers abandoned their cars. Within an hour, the center span tore apart and fell into the water below. Amazingly, the only life lost was a dog left in a car. The bridge had already earned a nickname, \"Galloping Gertie,\" because its deck rose and fell in waves even on calm days. Some drivers crossed it just for the thrill of the ride. A film camera captured the final collapse, and the footage became one of the most famous engineering films ever made.", "Investigators discovered that the problem was not weak steel. Instead, the wind had pushed the bridge in a rhythm that matched the way the deck naturally wanted to move. Each gust added to the last, like a child pumping a swing higher and higher. The bridge was not too weak; it was shaped in a way that invited the wind to rock it. Engineers call this effect resonance. Every structure, from a guitar string to a skyscraper, has natural rhythms at which it prefers to move. When an outside force matches one of those rhythms, even gentle pushes can build into violent shaking.", "This discovery changed engineering. Designers began testing models of bridges in wind tunnels before building them. They learned to cut openings in decks so air could pass through and to add devices called dampers that soak up motion the way shock absorbers smooth a car ride. These changes added cost and time to every project, yet few engineers objected. The pictures of the twisting Tacoma deck were reminder enough of what could happen when the wind was ignored.", "Today, many of the world's longest bridges are built to move. The Akashi Kaikyo Bridge in Japan can sway several meters in a storm without danger. Its engineers did not fight the wind; they planned for it. Instead of fighting every gust, it stays safe by moving with it and then settling back into place.", "The fallen Tacoma bridge is now remembered less as a disaster than as a teacher. Its failure showed that the smartest structures are not the ones that refuse to bend, but the ones designed to bend safely. Engineering students around the world still watch the film of its collapse."], "g": ["Engineers thought stiff = strong", "Tacoma bridge collapsed in wind", "Rhythm, not weakness, caused it", "New testing and dampers", "Modern bridges sway safely", "Failure taught bending safely"], "m": "The Tacoma Narrows collapse taught engineers that bridges should be designed to move safely with the wind rather than resist it.", "q": [{"y": "main", "q": "Which statement best expresses the central idea of the passage?", "c": ["The Tacoma Narrows Bridge was poorly built with cheap steel.", "A famous bridge failure changed engineers' belief that bridges should be stiff, leading to designs that move safely.", "Wind tunnels are the most important tool in modern engineering.", "The Akashi Kaikyo Bridge is the longest bridge in the world."], "a": 1, "e": [5], "x": "B covers the whole passage: old belief → collapse → new designs.", "w": "C is a detail from paragraph 4 only — too narrow. A is directly contradicted by paragraph 3."}, {"y": "sup", "q": "Which sentence best supports the idea that the bridge's shape, not its strength, caused the collapse?", "c": ["\"Drivers abandoned their cars.\" (paragraph 2)", "\"The bridge was not too weak; it was shaped in a way that invited the wind to rock it.\" (paragraph 3)", "\"Designers began testing models of bridges in wind tunnels.\" (paragraph 4)", "\"Its engineers did not fight the wind; they planned for it.\" (paragraph 5)"], "a": 1, "e": [2], "x": "B states the claim directly: shape, not weakness.", "w": "C is about what happened AFTER, not the cause."}, {"y": "craft", "q": "Why does the author compare the wind to \"a child pumping a swing\" in paragraph 3?", "c": ["To show that the collapse was playful and harmless", "To explain how small pushes in rhythm can build into large motion", "To suggest children were near the bridge", "To argue that bridges should be shaped like swings"], "a": 1, "e": [2], "x": "The swing comparison makes a hard science idea (rhythm adding up) easy to picture.", "w": "D takes the comparison too literally."}, {"y": "trans", "q": "In paragraph 3, the word \"Instead\" signals that the author is", "c": ["giving an example of weak steel", "replacing a wrong explanation with the real one", "listing events in time order", "summarizing the passage"], "a": 1, "e": [2], "x": "'Instead' = turn. Not weak steel → instead, the rhythm of the wind.", "w": "A is the opposite: the author says it was NOT weak steel."}, {"y": "craft", "q": "How does paragraph 6 contribute to the passage?", "c": ["It introduces a new bridge for comparison.", "It reframes the collapse as a lesson, tying together the passage's main point.", "It gives technical details about dampers.", "It argues that the Tacoma bridge should be rebuilt."], "a": 1, "e": [5], "x": "A conclusion that restates the big idea: failure as teacher.", "w": "A — no new bridge appears in paragraph 6."}]}, {"t": "Grandma Lin's Dumplings", "k": "prose", "tip": "craft", "p": ["Every Sunday, Mei stood at her grandmother's counter and ruined dumplings. Her folds came out lumpy. Filling leaked from the edges. Grandma Lin's dumplings, meanwhile, lined up on the tray like tiny moons, each pleated exactly fourteen times. Mei had tried watching closely. She had tried folding slowly. She had even tried folding with her eyes closed, hoping her hands might know something her brain did not. Nothing worked. Each Sunday she went home with flour on her sleeves and a growing suspicion that she simply did not have the talent.", "\"Mine look like crumpled paper,\" Mei said one afternoon, tossing another failure aside. Her cheeks felt hot. Across the counter, Grandma Lin kept folding, her fingers moving so quickly they almost blurred.", "Grandma Lin did not answer right away. She wiped her hands, reached into a high cabinet, and pulled down a dented tin. Inside, wrapped in a faded cloth, was a photograph of a young girl at a crowded table. In front of her sat a plate of the ugliest dumplings Mei had ever seen. The edges gaped open. Some were flat as pancakes, and one had split down the middle so the filling spilled across the plate. Mei had never seen the tin before. It smelled faintly of old paper and jasmine.", "\"That is me,\" Grandma said, \"at your age. My mother made me fold two hundred before she let me cook a single one.\" She tapped the photo gently. \"I cried over those dumplings. I wanted to quit every day for a month.\"", "Mei laughed so hard she had to sit down. Then she looked again at the photo, at the girl's serious face, at the flour on her cheeks. The girl did not look embarrassed. She looked determined. Mei wondered how many failures it had taken to turn that girl into the woman beside her, whose hands now moved without thinking. Two hundred, at least. Maybe more.", "Mei picked up a fresh wrapper. Her first pleat slipped. Her second held. By the end of the afternoon, she had folded thirty dumplings, and only some of them looked like crumpled paper. Grandma Lin placed one of Mei's lopsided dumplings in the very center of the steamer, right beside her own. She did not rush. When a pleat tore, she pressed it flat and tried again instead of tossing the dumpling aside. Grandma Lin said nothing, but Mei noticed her humming."], "g": ["Mei's dumplings keep failing", "Mei feels frustrated", "Grandma shows old photo", "Grandma was bad once too", "Mei sees determination", "Mei keeps trying, improves"], "m": "Mei learns from her grandmother that skill comes from practice and persistence, not from being perfect at the start.", "q": [{"y": "main", "q": "Which statement best describes a central idea of the story?", "c": ["Dumplings must be pleated fourteen times.", "Skill grows through patient practice, even after many failures.", "Old photographs should be kept in tins.", "Grandparents are stricter than parents."], "a": 1, "e": [5], "x": "Mei sees Grandma once failed too, then keeps going and improves.", "w": "A is a detail from paragraph 1, not the message."}, {"y": "craft", "q": "Why does the author include the photograph in paragraph 3?", "c": ["To describe what the kitchen looked like long ago", "To reveal that Grandma Lin also struggled when she was young", "To show that Grandma Lin wants to stop cooking", "To introduce a new character who will appear later"], "a": 1, "e": [2, 3], "x": "The ugly dumplings in the photo prove Grandma was once a beginner too — the turning point.", "w": "A — the photo is about the dumplings, not the kitchen."}, {"y": "sup", "q": "Which detail best shows that Grandma Lin is proud of Mei's effort?", "c": ["\"She wiped her hands, reached into a high cabinet\"", "\"My mother made me fold two hundred\"", "\"Grandma Lin placed one of Mei's lopsided dumplings in the very center of the steamer, right beside her own.\"", "\"Her folds came out lumpy.\""], "a": 2, "e": [5], "x": "Putting Mei's dumpling in the center, next to her own, is an act of pride.", "w": "B is about Grandma's own past, not her feelings about Mei."}, {"y": "craft", "q": "The author's description of Grandma's dumplings as \"tiny moons\" in paragraph 1 mainly serves to", "c": ["show how perfect they look compared with Mei's", "suggest they are cooked at night", "explain how dumplings are shaped", "show that Grandma is old"], "a": 0, "e": [0], "x": "The image sets up a contrast: perfect moons vs. Mei's lumpy folds.", "w": "B reads the image too literally."}, {"y": "craft", "q": "How does paragraph 5 contribute to the development of the story?", "c": ["It shows Mei giving up.", "It marks Mei's shift from laughing to understanding, setting up her decision to try again.", "It describes Grandma's childhood home.", "It explains how to fold a dumpling."], "a": 1, "e": [4], "x": "Mei laughs, then notices the girl looked determined — the shift that leads to paragraph 6.", "w": "A is the opposite of what happens next."}]}, {"t": "The Secret Life of City Trees", "k": "prose", "tip": "sup", "p": ["Most people walk past street trees without a second glance. Yet scientists increasingly see these trees as some of the hardest-working members of a city. They stand in small squares of dirt between the curb and the sidewalk, often surrounded by parked cars and rushing pedestrians. Their work is mostly invisible, which is exactly why it is so easy to overlook.", "Consider heat. Pavement and rooftops soak up sunlight and release it slowly, making cities several degrees hotter than nearby countryside. A single mature tree can shade a sidewalk and release water through its leaves, cooling the air around it. Researchers in one study found that blocks with many trees were up to ten degrees cooler on summer afternoons than treeless blocks. On the hottest days, that difference can matter for health. Heat waves send many people to hospitals each summer, and older residents without air conditioning are especially at risk. Shade from a single tree can make a bus stop or front stoop bearable.", "Trees also manage water. During heavy storms, rain rushes off hard surfaces and floods sewers. Tree roots and the soil around them absorb much of that water, slowing it down and reducing flooding. Leaves help, too. A large tree's canopy catches raindrops before they hit the ground, giving the soil more time to drink. Some cities now count trees as part of their storm-water systems, the same way they count pipes and drains.", "Life on the street is hard for a tree, however. Roots are squeezed by pipes and sidewalks, salt from winter roads poisons the soil, and trucks scrape bark. As a result, many city trees live only a fraction as long as trees in a forest. Dogs, bicycles locked to trunks, and construction crews add to the damage. In some neighborhoods, young trees die within just a few years of being planted.", "Some neighborhoods are fighting back. Volunteers in New York water young trees during dry spells, loosen packed soil, and put up small fences to protect tree beds. In return, the trees grow faster and survive longer. Some groups hold \"tree care days,\" when neighbors gather with shovels and watering cans. City programs also give out free trees to residents who promise to look after them. Small acts of attention, it turns out, make a big difference to a young tree's chances.", "A street tree may look ordinary, but it is quietly cooling, cleaning, and protecting the people who walk beneath it. Caring for it is one of the simplest ways to care for a city. Next time you pass one, it may be worth a second look, and maybe a bucket of water."], "g": ["Street trees work hard", "Trees cool hot cities", "Trees soak up storm water", "City life harms trees", "Volunteers help trees survive", "Caring for trees helps cities"], "m": "City trees provide important benefits like cooling and flood control, but they struggle to survive and need people's care.", "q": [{"y": "main", "q": "Which statement best expresses the central idea of the passage?", "c": ["Trees in forests live longer than city trees.", "City trees provide valuable benefits but face hardships, so they deserve care.", "Pavement makes cities hotter.", "Volunteers in New York water trees."], "a": 1, "e": [5], "x": "Benefits (2–3), struggles (4), care (5–6).", "w": "D is one detail from paragraph 5."}, {"y": "sup", "q": "Which sentence best supports the claim that trees help cool cities?", "c": ["\"trucks scrape bark\"", "\"blocks with many trees were up to ten degrees cooler on summer afternoons than treeless blocks\"", "\"Tree roots and the soil around them absorb much of that water\"", "\"Volunteers in New York water young trees during dry spells\""], "a": 1, "e": [1], "x": "A measured temperature difference proves cooling.", "w": "C is true but about flooding, not heat."}, {"y": "trans", "q": "In paragraph 4, the word \"however\" signals a shift from", "c": ["the benefits trees give to the problems trees face", "heat to flooding", "volunteers to scientists", "forests to cities"], "a": 0, "e": [3], "x": "Paragraphs 2–3 = what trees do for us; 4 = what's hard for trees.", "w": "B — flooding was already covered in paragraph 3."}, {"y": "trans", "q": "The phrase \"As a result\" in paragraph 4 introduces", "c": ["an effect of the harsh conditions just described", "an example of a tree benefit", "a contrast with paragraph 3", "the author's opinion"], "a": 0, "e": [3], "x": "Squeezed roots, salt, scrapes → as a result, short lives.", "w": "C — it is cause and effect, not contrast."}, {"y": "craft", "q": "Why does the author include paragraph 5?", "c": ["To show that people can help solve the problem described in paragraph 4", "To explain how storms cause floods", "To argue that trucks should be banned", "To describe forest trees"], "a": 0, "e": [4], "x": "Problem (4) → people fighting back (5).", "w": "C — the author never suggests a ban."}]}, {"t": "The Sandwich That Saved a Language", "k": "prose", "tip": "sup", "p": ["In 2010, a teacher in New Zealand noticed something troubling. Fewer of her students could speak te reo Māori, the language of the country's Indigenous people. Elders who spoke it fluently were growing older, and many young people knew only a few words. The teacher worried that within a generation, the language might be heard only in recordings. She was not alone. Communities across the country had been raising the same alarm for years.", "Languages disappear more often than most people realize. Experts estimate that one of the world's roughly seven thousand languages falls silent every few months. When the last speakers are gone, songs, jokes, and ways of seeing the world can vanish with them. Languages usually fade slowly. Parents begin speaking a more common language at home, hoping it will help their children succeed. Each generation knows a little less than the one before, until only the oldest people remember.", "New Zealand, however, chose a different path. Starting in the 1980s, communities opened \"language nests,\" preschools where toddlers spent their days surrounded only by te reo Māori. Grandparents cooked lunch, told stories, and sang with the children, all in the language. A simple act like asking for a sandwich became a lesson. The nests were not fancy. Many met in community halls or borrowed rooms, with handmade toys and donated books. What mattered was that the children heard the language naturally, all day long, from people who loved them.", "The results were striking. Children who attended language nests grew up speaking te reo Māori comfortably, and many went on to schools taught entirely in the language. Today, signs, television programs, and even the national anthem appear in both Māori and English. Parents, too, began taking classes so they could keep up with their children at home. In many families, kids taught their parents new words at the dinner table.", "Other communities have copied the idea. In Hawaii, a similar program helped bring back the Hawaiian language, which had once been banned in schools. Families in Wales, Ireland, and parts of Canada have built their own versions. Each version is adapted to its own community, but the core idea stays the same: surround young children with a language early, and they will learn it as easily as breathing.", "The lesson is hopeful. A language does not have to be saved in a museum. It can be saved at a lunch table, one ordinary conversation at a time. Not every endangered language has found such success, and much work remains. Still, the language nests have shown that the story of a disappearing language does not have to end in silence."], "g": ["Fewer kids speak Māori", "Languages vanish worldwide", "Language nests start", "Kids become fluent speakers", "Others copy the idea", "Everyday talk saves languages"], "m": "Language nests in New Zealand show that endangered languages can be revived through everyday conversation with young children.", "q": [{"y": "main", "q": "Which statement best expresses the central idea of the passage?", "c": ["Many languages disappear every year.", "Programs like New Zealand's language nests show that endangered languages can be revived through daily use.", "Grandparents are the best cooks.", "Hawaii once banned its own language in schools."], "a": 1, "e": [5], "x": "Problem → language nests → results → spread → hopeful lesson.", "w": "A is only paragraph 2 — the problem, not the main idea."}, {"y": "sup", "q": "Which sentence best supports the claim that language nests were successful?", "c": ["\"Elders who spoke it fluently were growing older.\"", "\"Children who attended language nests grew up speaking te reo Māori comfortably.\"", "\"Experts estimate that one of the world's roughly seven thousand languages falls silent every few months.\"", "\"Grandparents cooked lunch, told stories, and sang with the children.\""], "a": 1, "e": [3], "x": "B is a result — proof that it worked.", "w": "D describes WHAT the nests did, not whether they succeeded."}, {"y": "trans", "q": "In paragraph 3, the word \"however\" mainly signals", "c": ["a contrast between languages disappearing and New Zealand's response", "an example of a lost language", "a result of the language nests", "the time order of events"], "a": 0, "e": [1, 2], "x": "Paragraph 2: languages vanish. However → NZ did something different.", "w": "C — results come in paragraph 4."}, {"y": "craft", "q": "Why does the author include paragraph 2?", "c": ["To show the problem is widespread, making New Zealand's success more meaningful", "To argue that all languages will disappear", "To list the world's languages", "To describe Hawaii's program"], "a": 0, "e": [1], "x": "It gives the big picture so the solution matters more.", "w": "B overstates — the passage ends hopeful."}, {"y": "sup", "q": "Which detail best supports the idea that the language nests approach has spread beyond New Zealand?", "c": ["\"signs, television programs, and even the national anthem appear in both Māori and English\"", "\"In Hawaii, a similar program helped bring back the Hawaiian language\"", "\"A simple act like asking for a sandwich became a lesson.\"", "\"Starting in the 1980s, communities opened language nests...\""], "a": 1, "e": [4], "x": "Hawaii is outside New Zealand — direct proof of spreading.", "w": "A is true but it's about New Zealand itself."}, {"y": "craft", "q": "The phrase \"saved at a lunch table\" in paragraph 6 mainly emphasizes that", "c": ["languages are best learned while eating", "language survives through ordinary, everyday use", "museums are useless", "lunch is the most important meal"], "a": 1, "e": [5], "x": "Contrasted with a museum: languages live in daily conversation.", "w": "A is too literal."}]}, {"t": "The Chess Clock", "k": "prose", "tip": "craft", "p": ["Dev had beaten everyone in the school chess club except Ms. Okafor, the math teacher who ran it. She played slowly, almost lazily, sipping tea between moves while Dev bounced his knee under the table. Dev liked chess because it felt like a battle. He liked the sharp click of a captured piece and the moment his opponent's face fell. Ms. Okafor's face never fell. She simply studied the board, as if she had all the time in the world.", "\"Faster isn't smarter,\" she told him after their fourth game, the fourth one he had lost. Dev shrugged and packed up his pieces. He thought she was just making excuses for being slow.", "Dev didn't believe her. He practiced speed chess online every night, playing dozens of one-minute games until his fingers moved before his brain did. His rating climbed. He felt unstoppable. He watched videos of grandmasters playing lightning games and copied their openings. Some nights he played until his mom turned off the Wi-Fi.", "At the next club meeting, he set up the board across from Ms. Okafor and slammed down his first moves. By move twelve he had captured her bishop. By move fifteen he was sure he was winning. Then she moved a quiet little pawn, one square forward, and sat back. Across the room, other club members drifted over to watch. Dev grinned, enjoying the audience, and reached confidently for his queen.", "Dev stared. The pawn blocked his queen. In three moves, she would trap his king. He had been so busy grabbing pieces that he had never asked what her moves were planning. His stomach dropped. He had seen every capture, every quick win, but not the shape of her whole plan. Somewhere behind him, someone whispered, \"Oh no.\"", "For the first time all year, Dev stopped bouncing his knee. He looked at the board for six full minutes. Then he found it: a single knight move that slipped out of the trap. He traced every possible move in his head, one by one, the way he had never bothered to do before. The room went quiet around him.", "He still lost, but only after forty-one moves, the longest game anyone had ever played against her. Ms. Okafor set down her tea and smiled. \"Now,\" she said, \"you're playing chess.\" The watchers clapped. Dev looked at the board, then at his teacher, and realized he was not disappointed at all."], "g": ["Dev can't beat Ms. Okafor", "She says slow down", "Dev practices speed chess", "Dev attacks fast, falls into trap", "He missed her plan", "He slows down, escapes", "Loses, but plays better"], "m": "Dev learns that thinking carefully about the whole situation matters more than moving quickly.", "q": [{"y": "main", "q": "Which statement best expresses a central idea of the story?", "c": ["Speed chess is the best way to improve.", "Careful thinking is more valuable than rushing.", "Teachers always win at chess.", "Bishops are the most important chess piece."], "a": 1, "e": [5, 6], "x": "Dev only escapes when he slows down; Ms. Okafor praises it.", "w": "A is Dev's belief, which the story proves wrong."}, {"y": "craft", "q": "Why does the author describe Dev bouncing his knee in paragraphs 1 and 6?", "c": ["To show he is cold", "To show his impatience at first and then his new focus when he stops", "To show he plays sports", "To show Ms. Okafor is annoyed"], "a": 1, "e": [0, 5], "x": "Bouncing = restless; stopping = finally focused.", "w": "C reads the detail too literally."}, {"y": "sup", "q": "Which detail best shows that Dev's fast play caused his mistake?", "c": ["\"His rating climbed.\"", "\"He had been so busy grabbing pieces that he had never asked what her moves were planning.\"", "\"sipping tea between moves\"", "\"the longest game anyone had ever played against her\""], "a": 1, "e": [4], "x": "Directly links rushing to missing her plan.", "w": "A shows success online, not the mistake."}, {"y": "trans", "q": "In paragraph 4, the word \"Then\" marks", "c": ["the moment the game turns against Dev", "the end of the game", "a flashback", "Dev's victory"], "a": 0, "e": [3], "x": "Dev thinks he's winning... then the quiet pawn changes everything.", "w": "D is the opposite."}, {"y": "craft", "q": "How does Ms. Okafor's final line contribute to the story?", "c": ["It shows she is angry he lost.", "It shows Dev has finally learned the lesson she tried to teach him.", "It introduces a new rule of chess.", "It shows she wants to quit the club."], "a": 1, "e": [6], "x": "Echoes \"Faster isn't smarter\" — now he gets it.", "w": "A — she smiles."}, {"y": "craft", "q": "Why does the author include Ms. Okafor's line \"Faster isn't smarter\" early in the story?", "c": ["To set up the lesson Dev will learn by the end", "To show she dislikes speed", "To describe the chess club's rules", "To make her seem unkind"], "a": 0, "e": [1], "x": "Early hint of the theme, paid off at the end.", "w": "D — it's advice, not cruelty."}]}, {"t": "Why Octopuses Are So Clever", "k": "prose", "tip": "sup", "p": ["Picture a creature with no bones, three hearts, and blue blood that can open a jar, escape from a tank, and recognize individual people. This is not science fiction. It is the octopus, one of the most surprising animals in the ocean. Octopuses have lived in Earth's oceans for hundreds of millions of years, long before dinosaurs. Yet only recently have scientists begun to understand just how unusual their minds are.", "Scientists have long tested animal intelligence with puzzles. Octopuses excel at them. In one aquarium, an octopus named Inky squeezed through a gap in his tank, slid across the floor, and slipped down a drainpipe to the sea. In laboratories, octopuses have learned to unscrew lids to reach crabs inside. Some octopuses have been seen carrying coconut shells across the seafloor and assembling them into shelters, one of the few known cases of tool use among animals without backbones. Others have learned to turn off aquarium lights by squirting water at them.", "What makes their intelligence especially unusual is where their brains are. About two-thirds of an octopus's nerve cells are not in its head but in its eight arms. Each arm can taste, touch, and even make simple decisions on its own. An arm cut off from the body may still reach for food. Scientists compare this to having eight partners that each think a little for themselves while still following the main brain's general instructions. This arrangement helps explain how an octopus can explore a crack with one arm while searching for food with another.", "Researchers have also found that octopuses seem to have personalities. Some are shy and hide in corners; others are bold and curious. At one aquarium, a particular octopus repeatedly squirted water at a single staff member it seemed to dislike. Workers at aquariums often give octopuses toys, puzzles, and new objects to explore, because the animals seem to become bored without them.", "Strangely, octopuses live short lives, usually only one or two years. Unlike dolphins or apes, they do not learn from parents. Each octopus must figure out the world largely by itself, which makes its abilities even more remarkable. Most mother octopuses guard their eggs and die soon after they hatch, so the young never meet their parents. From the moment they hatch, the tiny octopuses are on their own.", "Studying octopuses has pushed scientists to rethink what intelligence looks like. It does not have to come in a body like ours, with one central brain. Sometimes it is spread out across eight curious arms. For scientists, the octopus is a reminder that there may be many ways to be smart, and some of them are very different from our own."], "g": ["Octopuses are surprising animals", "They solve puzzles, escape", "Brains spread through arms", "They have personalities", "Short lives, learn alone", "Intelligence can look different"], "m": "Octopuses show remarkable, unusual intelligence that challenges scientists' ideas of what a smart animal must be like.", "q": [{"y": "main", "q": "Which statement best expresses the central idea of the passage?", "c": ["Octopuses have three hearts and blue blood.", "Octopuses' unusual intelligence is changing how scientists think about intelligence.", "Inky the octopus escaped through a drainpipe.", "Octopuses dislike aquarium workers."], "a": 1, "e": [5], "x": "Every paragraph adds evidence of unusual smarts, ending in rethinking intelligence.", "w": "C is one example in paragraph 2 — too narrow."}, {"y": "sup", "q": "Which detail best supports the idea that octopus intelligence is spread throughout the body?", "c": ["\"an octopus named Inky squeezed through a gap in his tank\"", "\"About two-thirds of an octopus's nerve cells are not in its head but in its eight arms.\"", "\"Some are shy and hide in corners\"", "\"octopuses live short lives\""], "a": 1, "e": [2], "x": "Nerve cells in the arms = intelligence spread out.", "w": "A shows cleverness, but not WHERE the brain is."}, {"y": "sup", "q": "Which sentence best supports the claim that octopuses have personalities?", "c": ["\"octopuses have learned to unscrew lids to reach crabs inside\"", "\"a particular octopus repeatedly squirted water at a single staff member it seemed to dislike\"", "\"Each arm can taste, touch, and even make simple decisions\"", "\"they do not learn from parents\""], "a": 1, "e": [3], "x": "Disliking one specific person is personality.", "w": "A shows problem-solving, not personality."}, {"y": "craft", "q": "Why does the author begin the passage with a description of the octopus's features without naming it?", "c": ["To confuse the reader", "To create curiosity before revealing the animal", "To argue octopuses are science fiction", "To list facts that are later disproven"], "a": 1, "e": [0], "x": "A hook — mystery first, then the reveal.", "w": "C — the author says \"This is not science fiction.\""}, {"y": "trans", "q": "How does paragraph 5 connect to the rest of the passage?", "c": ["It contradicts the claim that octopuses are smart.", "It adds a fact (they learn alone, in a short life) that makes their intelligence more impressive.", "It introduces dolphins as the main topic.", "It explains how octopuses escape tanks."], "a": 1, "e": [4], "x": "\"which makes its abilities even more remarkable.\"", "w": "C — dolphins are only a comparison."}]}, {"t": "How Honeybees Vote", "k": "prose", "tip": "main", "p": ["Every spring, a crowded honeybee colony faces a major decision. The old queen leaves the hive with thousands of workers, and the swarm clusters on a tree branch. It must now choose a new home, and the wrong choice could doom the colony. A swarm hanging from a branch looks like a dripping beard of bees. It cannot stay there long. Without shelter, the bees will be exposed to wind, rain, and cold, and their stored energy will run low within a few days.", "The bees do not let the queen decide. Instead, a few hundred older workers become scouts. They fly out to inspect possible homes, such as hollow trees, checking the size, the entrance, and how dry the space is. A good home must be large enough to store honey for winter, with a small entrance that is easy to defend. A space that is too damp or too exposed can mean death for the colony when cold weather arrives.", "When a scout finds a promising spot, she returns and performs a \"waggle dance\" on the surface of the swarm. The better the site, the longer and more enthusiastically she dances. Other scouts who watch may fly out to inspect the site themselves. The direction of the dance even tells other bees where to fly, pointing them toward the site in relation to the sun. In this way, a scout shares both directions and her opinion.", "Over hours or days, scouts for weaker sites dance less and less, while support for the best site grows. Once about fifteen scouts are gathered at a single location at the same time, the decision is made. The whole swarm lifts off and flies there. Scouts do not simply follow the crowd. Each one visits a site herself before deciding to dance for it, so popular sites must keep earning support.", "Biologist Thomas Seeley, who studied swarms for decades, found that bees choose the best available site most of the time. He noted that their method includes lessons for people: gather many options, let each be checked independently, and allow open debate before deciding. Seeley even used these lessons with groups of people at his university, encouraging them to share ideas openly instead of following the loudest voice in the room.", "A swarm of bees has no leader giving orders. Still, by sharing information fairly, it makes choices wiser than any single bee could. Their method has been tested by millions of years of survival."], "g": ["Swarm must choose home", "Scouts inspect sites", "Dances advertise good sites", "Best site wins support", "Lessons for human decisions", "Group shares, chooses wisely"], "m": "Honeybee swarms choose new homes through a fair, group decision process that usually picks the best site and offers lessons for people.", "q": [{"y": "main", "q": "Which statement best expresses the central idea of the passage?", "c": ["The queen bee chooses where the colony lives.", "Honeybees make wise group decisions by sharing information, a method people can learn from.", "Bees live in hollow trees.", "Thomas Seeley studied bees for decades."], "a": 1, "e": [4, 5], "x": "Process (2–4) + why it's wise and what we learn (5–6).", "w": "A is false — paragraph 2 says the queen doesn't decide."}, {"y": "sup", "q": "Which sentence best supports the idea that the bees' method works well?", "c": ["\"The old queen leaves the hive with thousands of workers\"", "\"bees choose the best available site most of the time\"", "\"They fly out to inspect possible homes, such as hollow trees\"", "\"The whole swarm lifts off and flies there.\""], "a": 1, "e": [4], "x": "A research result showing success.", "w": "C describes the process, not how well it works."}, {"y": "trans", "q": "In paragraph 2, the word \"Instead\" shows that", "c": ["scouts, not the queen, make the choice", "the queen gives orders", "the bees find a home immediately", "scouts are younger bees"], "a": 0, "e": [1], "x": "Not the queen → instead, the scouts.", "w": "B is what 'Instead' rejects."}, {"y": "craft", "q": "How are paragraphs 2–4 mainly organized?", "c": ["By describing the steps of the decision in order", "By comparing bees with ants", "By listing problems with hives", "By arguing against Seeley"], "a": 0, "e": [1, 2, 3], "x": "Scout → dance → support grows → decision.", "w": "B — ants never appear."}, {"y": "craft", "q": "Why does the author include Seeley's lessons for people in paragraph 5?", "c": ["To connect the bees' behavior to human decision-making", "To argue people should live in hives", "To describe the waggle dance", "To question whether bees really vote"], "a": 0, "e": [4], "x": "Widens the topic: bees model good choices.", "w": "D — Seeley supports the idea."}]}, {"t": "The Girl Who Mapped the Ocean Floor", "k": "prose", "tip": "main", "p": ["In the 1950s, few people believed women belonged in science, and almost no one imagined the bottom of the ocean held mountains. Marie Tharp would prove both assumptions wrong. At the time, most scientists pictured the deep sea floor as a flat, muddy plain. Few women held jobs as scientists at all, and those who did were often given only the most tedious tasks.", "Tharp worked at a university lab in New York, where her male colleagues sailed on research ships to collect measurements of ocean depth. Women were not allowed aboard. So Tharp stayed behind, surrounded by thousands of numbers, and began turning them into drawings. The numbers came from ships that bounced sound waves off the sea floor and timed the echoes. Each measurement was one tiny dot of information. On their own, the dots meant little. It was slow, careful work that required patience and a sharp eye for patterns. Tharp spent months hunched over her drafting table.", "Line by line, she plotted the depths on large sheets of paper. Slowly, a shape emerged: a long chain of underwater mountains running down the middle of the Atlantic Ocean. Even more surprising, a deep valley split the center of those mountains. The mountains stretched for thousands of miles, taller in places than the Alps. No one had ever seen them, because they lay under miles of dark water. Tharp checked her calculations again and again, sure she must have made a mistake.", "Tharp believed the valley showed that the ocean floor was pulling apart, evidence for the idea that continents slowly move. Her supervisor dismissed it as \"girl talk.\" Yet the evidence kept growing, and within a few years scientists around the world agreed she was right. Later research confirmed that the valley ran along the ridges of every ocean, circling the planet like the seam on a baseball.", "In 1977, Tharp and her partner published a map of the entire ocean floor. For the first time, people could see that the planet's surface was covered in ridges, trenches, and mountains hidden under the waves. An artist turned their work into a painted map that hung in classrooms around the world. Many students who grew up to become scientists remember staring at it.", "Tharp once said she had \"a blank canvas to fill with extraordinary possibilities.\" Shut out of the ships, she found a way to see farther than anyone aboard them. Her map is still regarded as one of the most important images in the history of Earth science."], "g": ["Tharp challenged two assumptions", "Banned from ships, drew data", "Found undersea mountains, valley", "Valley proved moving continents", "Published full ocean map", "She saw farther anyway"], "m": "Despite being excluded because she was a woman, Marie Tharp used data to map the ocean floor and helped prove continents move.", "q": [{"y": "main", "q": "Which statement best expresses the central idea of the passage?", "c": ["Research ships were not safe for women.", "Marie Tharp overcame exclusion to make discoveries that changed how scientists understood Earth.", "The Atlantic Ocean contains a valley.", "Maps are drawn on large sheets of paper."], "a": 1, "e": [0, 5], "x": "Covers both her obstacle and her achievement.", "w": "C is one discovery — too narrow."}, {"y": "sup", "q": "Which sentence best supports the idea that Tharp faced unfair treatment?", "c": ["\"Line by line, she plotted the depths on large sheets of paper.\"", "\"Her supervisor dismissed it as 'girl talk.'\"", "\"In 1977, Tharp and her partner published a map.\"", "\"a deep valley split the center of those mountains\""], "a": 1, "e": [3], "x": "Dismissing her science because she was a woman is unfair treatment.", "w": "A shows her work, not unfairness."}, {"y": "trans", "q": "In paragraph 4, the word \"Yet\" introduces", "c": ["evidence that Tharp was wrong", "the idea that Tharp was proven right despite being dismissed", "a new scientist", "a description of the map"], "a": 1, "e": [3], "x": "Dismissed → yet evidence grew and she was right.", "w": "A is the opposite."}, {"y": "craft", "q": "Why does the author end with Tharp's quote and the final sentence?", "c": ["To show she wanted to be a painter", "To emphasize that she turned being excluded into an advantage", "To describe the research ships", "To introduce her partner"], "a": 1, "e": [5], "x": "\"Shut out... she found a way to see farther\" — obstacle turned strength.", "w": "A takes \"canvas\" literally."}, {"y": "craft", "q": "How does paragraph 1 contribute to the structure of the passage?", "c": ["It lists her awards.", "It sets up two assumptions that the rest of the passage shows her proving wrong.", "It describes the map in detail.", "It explains continental drift."], "a": 1, "e": [0], "x": "Two wrong beliefs introduced, then disproved.", "w": "C — the map comes in paragraph 5."}]}, {"t": "The Lost Mitten Project", "k": "prose", "tip": "craft", "p": ["Every winter, the lost-and-found box outside the main office of Lincoln Middle School overflowed with single mittens. Nobody ever claimed them. In February, the custodian, Mr. Ruiz, quietly threw them away. There were red ones and green ones, fuzzy ones and knitted ones, mittens with snowflakes and mittens with cartoon cats. Students walked past the box every day without looking.", "Amara noticed this on the day she lost her own blue mitten. She dug through the box for ten minutes and found three blue mittens, none of them hers. Standing there with the pile in her arms, she had an idea. It seemed wrong that so many warm things ended up in the trash while some people in the city did not have mittens at all. She thought about the kids she saw waiting for the bus each morning with their hands jammed into their pockets.", "\"What if,\" she asked her friend Theo, \"we sewed the leftovers into pairs that don't match?\" She held up a red mitten and a green one side by side. To her, they looked cheerful together, like a holiday decoration.", "Theo laughed. \"Who wants mismatched mittens?\" He picked up a lonely purple mitten and dangled it by the thumb. \"People like things that match. Trust me.\" Amara just smiled and put the purple mitten in her backpack.", "Amara did not argue. Instead, she borrowed her aunt's sewing kit, paired a striped mitten with a polka-dot one, and stitched a tiny tag inside that read \"Odd Couple #1.\" She wore them to school the next day. The stitching was crooked, and one mitten was clearly bigger than the other. She did not care.", "By lunch, three classmates had asked where she got them. By Friday, Theo was sorting mittens by size on the cafeteria table, and the art teacher had offered yarn for decorations. The students made fifty-two pairs and donated them to a shelter downtown. Students wrote cheerful notes to tuck inside each pair. Some classmates brought single mittens from home that had been sitting in drawers for years. The shelter director sent a thank-you letter that the principal read over the loudspeaker.", "In February, Mr. Ruiz found the lost-and-found box empty for the first time in years. Taped inside was a note: \"Nothing here is lost anymore.\" He read it twice, smiled, and left the box exactly where it was. Next winter, the students said, they would start the project again, and this time they planned to add scarves and hats."], "g": ["Lost mittens get thrown away", "Amara gets an idea", "She proposes mismatched pairs", "Theo doubts it", "Amara makes a pair", "Project grows, mittens donated", "Box empty, nothing lost"], "m": "Amara turns unwanted lost mittens into a project that unites her classmates and helps others.", "q": [{"y": "main", "q": "Which statement best describes a central idea of the story?", "c": ["Mittens should always match.", "One person's creative idea can grow into something that helps many people.", "Custodians work hard in winter.", "Sewing is difficult to learn."], "a": 1, "e": [5, 6], "x": "Amara's idea spreads to classmates and a shelter.", "w": "A is Theo's early doubt, which the story overturns."}, {"y": "craft", "q": "Why does the author include paragraph 1?", "c": ["To set up the problem that Amara's idea solves", "To describe Mr. Ruiz's job in detail", "To show the school is messy", "To introduce Theo"], "a": 0, "e": [0], "x": "Unclaimed mittens get thrown away — the problem.", "w": "D — Theo appears later."}, {"y": "trans", "q": "In paragraph 5, the word \"Instead\" shows that Amara", "c": ["proves her idea by doing it rather than arguing", "gives up on her idea", "agrees with Theo", "asks a teacher for help"], "a": 0, "e": [4], "x": "She didn't argue; instead she made a pair.", "w": "B is the opposite."}, {"y": "sup", "q": "Which detail best shows that Theo changed his mind?", "c": ["\"Who wants mismatched mittens?\"", "\"By Friday, Theo was sorting mittens by size on the cafeteria table\"", "\"three classmates had asked where she got them\"", "\"she borrowed her aunt's sewing kit\""], "a": 1, "e": [5], "x": "The doubter is now helping.", "w": "A is his doubt, before he changes."}, {"y": "craft", "q": "How does the note in the final paragraph contribute to the story?", "c": ["It shows the project succeeded, giving the story a satisfying ending.", "It shows Mr. Ruiz is confused.", "It introduces a mystery.", "It shows Amara found her blue mitten."], "a": 0, "e": [6], "x": "Empty box + note = complete success.", "w": "D — the story never says she found it."}]}, {"t": "The Four-Day School Week Debate", "k": "prose", "tip": "trans", "p": ["In hundreds of small school districts across the United States, Friday is no longer a school day. Students attend longer classes Monday through Thursday and stay home on the fifth day. Supporters call it smart. Critics call it risky. The trend has grown steadily over the past twenty years, especially in western states such as Colorado, Oklahoma, and Missouri. The debate over it touches on money, learning, and family life.", "The idea began mostly as a way to save money. Rural districts, where buses travel long distances, can save on fuel, heating, and staff costs by closing one day a week. Some districts also say the schedule helps them hire teachers, who value the extra day off. In places where students may live an hour from school, transportation alone can eat up a large share of the budget. Cutting one day of bus routes can free up money for other needs.", "Students often like it, too. They report feeling less tired and having more time for jobs, family, and appointments. In some schools, attendance on the remaining days has improved. Teachers in some districts use the fifth day for training or planning, which they say makes their lessons stronger. Some high school students use the day for internships or college classes.", "However, the evidence on learning is mixed. Several studies have found that students in four-day districts score slightly lower in math and reading over time than similar students in five-day districts. Younger children may struggle with longer days, and they lose hours of instruction across a year. Researchers caution that results vary. Districts that use the extra day for tutoring or enrichment programs seem to see smaller drops in achievement than those that simply close.", "Families face challenges as well. Parents who work on Fridays must find childcare, which can be expensive. For students who rely on school meals, a missing school day can also mean a missing meal. Some districts have responded by offering optional Friday programs or sending meals home on Thursday. These solutions help, but they also cost money, cutting into the savings.", "For now, the four-day week remains an experiment. It offers real benefits for some communities, but those benefits come with costs. Districts considering it must weigh what they save against what students might lose. Many researchers say more long-term studies are needed before anyone can say for certain whether the change helps or hurts students overall."], "g": ["Some schools skip Fridays", "Started to save money", "Students like it", "Learning evidence is mixed", "Families face childcare, meals", "Weigh benefits against costs"], "m": "The four-day school week offers savings and student benefits but may cost learning and burden families, so districts must weigh both.", "q": [{"y": "main", "q": "Which statement best expresses the central idea of the passage?", "c": ["Four-day weeks save rural districts money.", "The four-day school week has both benefits and drawbacks that districts must weigh.", "Students prefer four-day weeks.", "Four-day weeks should be banned."], "a": 1, "e": [5], "x": "Balanced: pros (2–3), cons (4–5), conclusion (6).", "w": "A is just paragraph 2. D takes a side the author never takes."}, {"y": "trans", "q": "What is the purpose of \"However\" at the beginning of paragraph 4?", "c": ["To add another benefit", "To shift from the benefits to the drawbacks", "To give an example of saving money", "To conclude the passage"], "a": 1, "e": [3], "x": "Paragraphs 2–3 are benefits; 'However' turns to problems.", "w": "A — paragraph 4 is not a benefit."}, {"y": "sup", "q": "Which sentence best supports the claim that four-day weeks may hurt learning?", "c": ["\"Students attend longer classes Monday through Thursday.\"", "\"students in four-day districts score slightly lower in math and reading over time\"", "\"Some districts also say the schedule helps them hire teachers\"", "\"attendance on the remaining days has improved\""], "a": 1, "e": [3], "x": "Lower scores = evidence of hurt learning.", "w": "D supports the opposite side."}, {"y": "trans", "q": "The phrase \"as well\" in paragraph 5 shows that the paragraph", "c": ["adds more drawbacks to those in paragraph 4", "contradicts paragraph 4", "gives an example of a benefit", "summarizes the whole passage"], "a": 0, "e": [4], "x": "'As well' = also. More costs, now for families.", "w": "B — it agrees with 4, it doesn't contradict it."}, {"y": "craft", "q": "How does the author mainly organize the passage?", "c": ["By telling events in time order", "By presenting benefits, then drawbacks, then a balanced conclusion", "By comparing two specific schools", "By describing a problem and one solution"], "a": 1, "e": [5], "x": "Pros → cons → weigh them.", "w": "D — the author doesn't push a single solution."}, {"y": "craft", "q": "Why does the author end paragraph 1 with \"Supporters call it smart. Critics call it risky.\"?", "c": ["To show the author agrees with critics", "To introduce that the passage will present both sides", "To describe the school schedule", "To give a statistic"], "a": 1, "e": [0], "x": "Previews the two-sided structure.", "w": "A — the author stays neutral."}]}, {"t": "Why We Remember Embarrassing Moments", "k": "prose", "tip": "sup", "p": ["You may not remember what you ate for lunch last Tuesday, but you probably remember the time you tripped in front of your whole class. Why do embarrassing moments stick in our minds so stubbornly? Years later, the memory can still make your face feel hot. Some people can replay an awkward moment from elementary school in perfect detail while forgetting entire weeks of ordinary life.", "Part of the answer lies in a small, almond-shaped part of the brain called the amygdala. When something triggers strong emotion, the amygdala signals other brain areas to treat the moment as important. As a result, emotional events are stored more vividly than ordinary ones. This is the same system that helps us remember a frightening experience, like touching a hot stove. Strong feelings act like a highlighter, marking certain memories as worth keeping.", "From an evolutionary point of view, this makes sense. For early humans, being rejected by the group could be dangerous. Remembering social mistakes helped people avoid repeating them. A person who forgot an embarrassing mistake might make it again and lose the trust of others. Over time, brains that remembered such moments may have helped their owners survive. Belonging to a group meant sharing food, protection, and help in hard times.", "However, our memories are often unfair to us. Psychologists have found that people greatly overestimate how much others notice their mistakes, an effect called the \"spotlight effect.\" In one study, students wearing an embarrassing T-shirt guessed that about half their classmates noticed it. In fact, fewer than a quarter did. Researchers believe this happens because each of us is at the center of our own experience. We know every detail of our own mistakes, so we assume everyone else noticed them too.", "Knowing this can help. When an embarrassing memory replays, it is worth remembering that most people forgot it long ago, if they noticed at all. Some psychologists suggest treating these memories the way you would a friend's mistake: with a laugh and kindness. Talking about an embarrassing moment with a trusted friend can also shrink it. Often, the friend has a similar story to share. Simply putting the memory into words can help the brain file it away as less threatening.", "Embarrassing memories, in other words, are a sign of a brain trying to protect us. They do not have to define us. They are simply evidence of a brain doing its job a little too well."], "g": ["Embarrassing moments stick", "Amygdala strengthens emotional memories", "Helped early humans survive", "Others notice less than we think", "Treat memories with kindness", "Memories protect, don't define"], "m": "Embarrassing memories stick because the brain treats emotional events as important, but others notice our mistakes far less than we think.", "q": [{"y": "main", "q": "Which statement best expresses the central idea of the passage?", "c": ["The amygdala is shaped like an almond.", "Our brains make embarrassing moments memorable, but we should not let them weigh on us because others notice less than we think.", "Early humans lived in groups.", "Embarrassing T-shirts should be avoided."], "a": 1, "e": [5], "x": "Why they stick (2–3) + why not to worry (4–6).", "w": "A is a tiny detail."}, {"y": "sup", "q": "Which sentence best supports the idea that people overestimate how much others notice them?", "c": ["\"emotional events are stored more vividly than ordinary ones\"", "\"students... guessed that about half their classmates noticed it. In fact, fewer than a quarter did.\"", "\"being rejected by the group could be dangerous\"", "\"you probably remember the time you tripped\""], "a": 1, "e": [3], "x": "Guess (half) vs. reality (under a quarter).", "w": "A explains memory, not overestimation."}, {"y": "trans", "q": "What does \"However\" at the beginning of paragraph 4 signal?", "c": ["A shift from why these memories are useful to how they can mislead us", "Another reason memories help us", "An example of the amygdala", "The passage's conclusion"], "a": 0, "e": [3], "x": "Useful (3) → however, unfair to us (4).", "w": "B — paragraph 4 is a downside."}, {"y": "craft", "q": "Why does the author begin with the examples of lunch and tripping?", "c": ["To connect the topic to the reader's own experience", "To argue lunch is unimportant", "To describe a science experiment", "To show the author is clumsy"], "a": 0, "e": [0], "x": "A relatable hook before the science.", "w": "C — the experiment is in paragraph 4."}, {"y": "craft", "q": "How does paragraph 3 contribute to the passage?", "c": ["It explains why remembering embarrassment may have helped humans survive.", "It describes the spotlight effect.", "It gives advice to readers.", "It disproves paragraph 2."], "a": 0, "e": [2], "x": "Gives the evolutionary reason.", "w": "B — that's paragraph 4."}]}, {"t": "The Accidental Inventions", "k": "prose", "tip": "craft", "p": ["We often picture inventors as geniuses who know exactly what they want to build. In reality, some of the most useful inventions began as mistakes. The truth is messier and more surprising. Many discoveries started with a spill, a stain, or a failed experiment that someone almost threw away.", "In 1945, an engineer named Percy Spencer was working with a machine that produced microwaves for radar. He noticed that a chocolate bar in his pocket had melted. Curious, he placed popcorn kernels near the machine, and they popped. Within two years, the first microwave oven was on sale. Spencer was not the first person to notice heat from the machines, but he was the first to wonder whether it could be useful. The first ovens were nearly six feet tall and cost thousands of dollars. Early models were mostly used in restaurants and ships before shrinking to fit home kitchens.", "Similarly, in 1968, chemist Spencer Silver was trying to create a super-strong glue. Instead, he made one so weak that it could be peeled off easily. For years, no one knew what to do with it. Then a coworker, frustrated that his paper bookmarks kept falling out of his hymn book, tried the weak glue. The sticky note was born. Today, billions of sticky notes are sold every year in dozens of colors and sizes. The product was almost abandoned after early tests, until free samples convinced office workers to try it.", "Even a lifesaving medicine began with a mess. In 1928, Alexander Fleming returned from vacation to find mold growing in one of his bacteria dishes. Around the mold, the bacteria had died. That mold led to penicillin, one of the first antibiotics. Fleming later admitted that his lab was often untidy. If he had cleaned the dish before leaving, the discovery might never have happened. Penicillin has since saved millions of lives.", "These stories share something important. Each inventor noticed something unexpected and, rather than throwing it away, asked a question. A melted chocolate bar or a moldy dish is only a mistake if no one wonders why it happened. Many scientists say that the most exciting phrase in research is not \"I found it!\" but \"That's funny...\" Noticing something odd is often the first step toward something new.", "So the next time an experiment goes wrong, it may be worth a second look. Curiosity can turn an accident into an invention. Even mistakes can be the start of something great."], "g": ["Inventions sometimes come from mistakes", "Melted chocolate led to microwave", "Weak glue became sticky notes", "Mold led to penicillin", "Inventors noticed, asked why", "Curiosity turns accidents useful"], "m": "Several important inventions came from accidents because curious people noticed something unexpected and asked why.", "q": [{"y": "main", "q": "Which statement best expresses the central idea of the passage?", "c": ["Penicillin was discovered in 1928.", "Curiosity about unexpected results has led to important inventions.", "Sticky notes were invented by accident.", "Inventors are always geniuses."], "a": 1, "e": [4, 5], "x": "Three examples + the shared lesson about curiosity.", "w": "C is one example. D is what the author argues AGAINST."}, {"y": "trans", "q": "What does the word \"Similarly\" at the start of paragraph 3 show?", "c": ["The sticky note story is another example of an accidental invention, like the microwave.", "The sticky note was invented at the same time as the microwave.", "The sticky note contrasts with the microwave.", "The sticky note was invented by Percy Spencer."], "a": 0, "e": [2], "x": "'Similarly' = another example of the same pattern.", "w": "B co <header><h1>📚 Van's Reading Power</h1><span class="timer" id="tm" style="display:none"></span><button class="sm" onclick="home()">🏠 Days</button><button class="sm" style="background:#27ae60" onclick="prog()">📊 Progress</button></header>
<div class="wrap" id="app"></div>
<script>
// deterministic shuffle so right answers aren't always the same letter
function rng(s){return()=>{s=(s*9301+49297)%233280;return s/233280}}
P.forEach((p,i)=>p.q.forEach((q,j)=>{const r=rng(i*31+j*7+3),idx=[0,1,2,3];for(let k=3;k>0;k--){const m=Math.floor(r()*(k+1));[idx[k],idx[m]]=[idx[m],idx[k]]}q.c=idx.map(x=>q.c[x]);q.a=idx.indexOf(q.a)}));
const L="ABCD",$=s=>document.getElementById(s),A=$("app");

function home(){stopT();const done=Object.keys(S.days).length;
A.innerHTML=`<div class="card"><div class="big">Hey Van! 🌟 ${done}/14 days done</div><p>10 minutes a day. Read with purpose, prove your answers, keep your pace. You're getting sharper every session.</p>
<label><input type="checkbox" id="gm" ${S.gist?"checked":""} onchange="S.gist=this.checked;save()"> ✍️ Read with Purpose (gist mode) — uncheck for quick review days</label></div><div class="grid">`+
P.map((p,i)=>{const d=S.days[i];return`<div class="day ${p.k} ${d?"done":""}" onclick="start(${i})">Day ${i+1} 📖 ${d?"✅":""}<b>${p.t}</b>${d?`Best: ${d.best}/${p.q.length}`:"Not started"}</div>`}).join("")+"</div>"}
function start(i){stopT();const p=P[i],t=TIPS[p.tip],t2=TIPS[p.q[0].y];
A.innerHTML=`<div class="card tip"><div class="big">💡 Strategy: ${t[0]}</div><p style="font-size:18px">${t[1]}</p>
<p><b>Pace:</b> about 1.5 minutes per question. Stuck at 2 minutes? <b>Guess, flag, move on.</b></p>
<p>Today's questions: ${[...new Set(p.q.map(q=>TYPES[q.y]))].map(x=>`<b>${x}</b>`).join(", ")}</p>
<button onclick="run(${i})" style="background:#27ae60;font-size:18px">Let's go! 🚀</button></div>`}
function passHTML(p){return p.p.map((s,i)=>`<div class="para" id="pa${i}" onclick="tapEv(${i})"><span class="n">${i+1}</span><div>${s}</div></div><div id="gs${i}"></div>`).join("")}
function run(i){const p=P[i];cur={i,p,ans:[],gists:[],main:"",q:0,sec:600,qsec:0,flags:[],stage:S.gist?"gist":"q",gi:0};
A.innerHTML=`<div class="two"><div class="card pas" id="pas"><h2 style="margin-top:0">${p.t}</h2>${passHTML(p)}</div><div id="side"></div></div>`;
$("tm").style.display="";T=setInterval(tick,1000);tick();cur.stage=="gist"?gistStep():qStep()}
function tick(){if(!cur)return;cur.sec--;if(cur.stage=="q")cur.qsec++;const s=Math.max(cur.sec,0);$("tm").textContent=(cur.sec<0?"⏰ ":"⏱ ")+Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
if(cur.stage=="q"&&cur.qsec==90&&$("pace"))$("pace").innerHTML='<div class="nudge" style="background:#e8f6ff;border-color:#3498db">⏳ 1.5 min — aim to choose soon.</div>';
if(cur.stage=="q"&&cur.qsec==120&&$("pace"))$("pace").innerHTML='<div class="nudge">🏃 2 minutes! <b>Guess, flag, move on.</b> You can come back. <button class="sm" onclick="flag()">🚩 Flag</button></div>'}
function gistStep(){const p=cur.p,g=cur.gi;
if(g<p.p.length){$("side").innerHTML=`<div class="card"><div class="big">✍️ Read with Purpose</div><p>Read paragraph <b>${g+1}</b>, then sum it up in 3–5 words.</p><p style="color:#666">Questions unlock after your gists.</p></div>`;
$("gs"+g).innerHTML=`<div class="gist"><input id="gin" placeholder="3–5 word gist" onkeydown="if(event.key=='Enter')subG()"><button class="sm" onclick="subG()">✓</button></div>`;$("gin").focus();$("pa"+g).scrollIntoView({block:"nearest"})}
else{$("side").innerHTML=`<div class="card"><div class="big">🎯 Main idea</div><p>In ONE sentence, what is the whole passage about?</p><textarea id="mi" rows="3" style="width:100%;border:2px solid #8e44ad;border-radius:8px;padding:6px"></textarea><button onclick="subM()">Compare</button></div>`}}
function subG(){const v=$("gin").value.trim();const w=v.split(/\s+/).filter(Boolean).length;if(w<2)return alert("Write a few words — 3 to 5 is perfect!");
cur.gists.push(v);$("gs"+cur.gi).innerHTML=`<div class="model">You: <b>${esc(v)}</b><br>Model: <i>${cur.p.g[cur.gi]}</i></div>`;cur.gi++;gistStep()}
function subM(){cur.main=$("mi").value.trim()||"(skipped)";$("side").innerHTML=`<div class="card"><p>You: <b>${esc(cur.main)}</b></p><p>Model: <i>${cur.p.m}</i></p><p>Does yours cover the WHOLE thing? 👍</p><button onclick="cur.stage='q';qStep()" style="background:#27ae60">Unlock questions 🔓</button></div>`}
function esc(s){return s.replace(/[<>&]/g,c=>({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]))}
function gpanel(){return cur.gists.length?`<div class="gp"><b>My gists</b><ol>${cur.gists.map(g=>`<li>${esc(g)}</li>`).join("")}</ol>${cur.main?`<b>Main idea:</b> ${esc(cur.main)}`:""}</div>`:""}
function clearEv(){document.querySelectorAll(".para").forEach(e=>e.classList.remove("ev","wrongpick"));$("pas").classList.remove("tap")}
function qStep(){clearEv();const p=cur.p,q=p.q[cur.q];cur.qsec=0;cur.picked=null;
$("side").innerHTML=`<div class="card"><div>Question ${cur.q+1} of ${p.q.length} <span class="tag t-${q.y}">${TYPES[q.y]}</span></div><h3>${q.q}</h3>
${q.c.map((c,k)=>`<button class="ch" id="c${k}" onclick="pick(${k})">${L[k]}. ${c}</button>`).join("")}<div id="pace"></div><div id="fb"></div></div>${gpanel()}`}
function flag(){if(!cur.flags.includes(cur.q))cur.flags.push(cur.q);$("pace").innerHTML='<div class="nudge">🚩 Flagged. Make your best guess now.</div>'}

const st=S.types[q.y]||(S.types[q.y]={r:0,n:0});st.n++;if(ok)st.r++;save();
q.c.forEach((_,j)=>{const b=$("c"+j);b.disabled=true;if(j==q.a)b.classList.add("ok");else if(j==k)b.classList.add("no")});
$("pace").innerHTML="";cur.stage="prove";$("pas").classList.add("tap");
$("fb").innerHTML=`<div class="fb">${ok?"🎉 <b>Yes!</b>":"💪 <b>Not quite</b> — the answer is "+L[q.a]+"."}<br>🔍 <b>Prove it:</b> tap the paragraph in the passage that supports the answer.<br><button class="sm" style="background:#888;margin-top:6px" onclick="tapEv(-1)">Skip</button></div>`}
function tapEv(i){if(!cur||cur.stage!="prove")return;const q=cur.p.q[cur.q];cur.stage="q";$("pas").classList.remove("tap");
const hit=q.e.includes(i);if(i>=0&&!hit)$("pa"+i).classList.add("wrongpick");q.e.forEach(e=>$("pa"+e).classList.add("ev"));$("pa"+q.e[0]).scrollIntoView({block:"nearest",behavior:"smooth"});
const last=cur.q==cur.p.q.length-1;
$("fb").innerHTML=`<div class="fb">${i<0?"":hit?"🎯 <b>Great evidence!</b><br>":"Close — the green part is the best proof.<br>"}✅ <b>Why it's right:</b> ${q.x}<br>⚠️ <b>The trap:</b> ${q.w}<br><button style="margin-top:8px;background:#27ae60" onclick="${last?"finish()":"cur.q++;qStep()"}">${last?"Finish 🏁":"Next ➜"}</button></div>`}
function repText(){const d=new Date().toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"});let t="📚 Van's Reading Report — "+d+"\n";const L2=S.last;
if(L2){t+="Done: Day "+(L2.i+1)+" – "+P[L2.i].t+"\nScore: "+L2.sc+"/"+L2.n+"\nTime: "+Math.floor(L2.time/60)+"m "+(L2.time%60)+"s (goal 10m)\nFlagged: "+(L2.flags.length?L2.flags.map(f=>"Q"+(f+1)).join(", "):"none")+"\n"}
t+="Accuracy by type:\n"+Object.keys(TYPES).map(k=>{const s=S.types[k]||{r:0,n:0};return"• "+TYPES[k]+": "+s.r+"/"+s.n+(s.n?" ("+Math.round(100*s.r/s.n)+"%)":"")}).join("\n");
const tot=Object.values(S.types).reduce((a,s)=>[a[0]+s.r,a[1]+s.n],[0,0]);t+="\nRunning total: "+Object.keys(S.days).length+"/14 days, "+tot[0]+"/"+tot[1]+" correct"+(tot[1]?" ("+Math.round(100*tot[0]/tot[1])+"%)":"");return t}
function sendRep(){const t=repText();if(navigator.share){navigator.share({text:t}).catch(()=>{})}else location.href="sms:+19174030806?&body="+encodeURIComponent(t)}
function copyRep(){const t=repText();(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>alert("Copied! Paste it in Messages."),()=>prompt("Copy this:",t))}
const REPB=`<p><button style="background:#e84393" onclick="sendRep()">💌 Send report to Mom</button> <button class="sm" style="background:#888" onclick="copyRep()">📋 Copy report</button></p>`;
function finish(){const p=cur.p,sc=cur.ans.filter(Boolean).length,used=600-cur.sec;stopT();const prev=S.days[cur.i];
S.days[cur.i]={best:Math.max(sc,prev?prev.best:0),last:sc,time:used};S.last={i:cur.i,sc,n:p.q.length,time:used,flags:cur.flags};save();
const msg=sc==p.q.length?"PERFECT! You're a reading machine! 🏆":sc>=p.q.length-1?"Awesome work! 🌟":sc>=3?"Solid! Every session makes you sharper. 💪":"Good effort — the explanations are where the learning happens. 🚀";
A.innerHTML=`<div class="card tip" style="text-align:center"><div class="big">${sc}/${p.q.length}</div><h2>${msg}</h2><p>Time: ${Math.floor(used/60)}m ${used%60}s ${used<=600?"⏱ on pace!":"(goal: 10 min)"}</p>${cur.flags.length?`<p>🚩 Flagged: ${cur.flags.map(f=>"Q"+(f+1)).join(", ")} — review these explanations.</p>`:""}${REPB}<button onclick="home()">Back to days</button> <button style="background:#27ae60" onclick="prog()">See progress</button></div>`;cur=null}
function prog(){stopT();cur=null;const col={main:"#2980b9",sup:"#27ae60",craft:"#8e44ad",trans:"#e67e22"};
A.innerHTML=`<div class="card"><div class="big">📊 Accuracy by question type</div>`+Object.keys(TYPES).map(t=>{const s=S.types[t]||{r:0,n:0},pc=s.n?Math.round(100*s.r/s.n):0;return`<b>${TYPES[t]}</b> — ${s.r}/${s.n} ${s.n?"("+pc+"%)":""}<div class="bar"><div style="width:${Math.max(pc,s.n?8:0)}%;background:${col[t]}">${s.n?pc+"%":""}</div></div>`}).join("")+
`<p>Days completed: ${Object.keys(S.days).length}/14</p>${REPB}<button class="sm" style="background:#888" onclick="if(confirm('Reset all progress?')){localStorage.removeItem('vanRead');S={days:{},types:{},gist:true};prog()}">Reset</button></div>`}
home();
</script></body></html>
